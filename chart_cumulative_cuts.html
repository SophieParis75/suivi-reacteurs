<script>
        const parseFrenchDateToISO = (str) => {
            if (!str) return null;
            const [datePart, timePart] = str.split(' ');
            if (!datePart || !timePart) return null;
            const [d, m, y] = datePart.split('/');
            const [h, min] = timePart.split(':');
            return `${y}-${m.padStart(2, '0')}-${d.padStart(2, '0')}T${h.padStart(2, '0')}:${min.padStart(2, '0')}:00+02:00`;
        };

        const generateDailyDates = (year) => {
            const dates = [];
            const isLeap = (year % 4 === 0 && year % 100 !== 0) || (year % 400 === 0);
            const daysInMonths = [31, isLeap ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];

            for (let month = 0; month < 12; month++) {
                const days = daysInMonths[month];
                for (let day = 1; day <= days; day++) {
                    const dStr = String(day).padStart(2, '0');
                    const mStr = String(month + 1).padStart(2, '0');
                    dates.push(`${dStr}/${mStr}/${year}`);
                }
            }
            return dates;
        };

        const dates2025 = generateDailyDates(2025);
        const dates2026 = generateDailyDates(2026);

        const backendUrl = "https://suivi-reacteurs.vercel.app";

        async function fetchDataForDate(dateStr) {
            const t1Raw = `${dateStr} 00:00`;
            const t2Raw = `${dateStr} 23:59`;
            const t1Iso = parseFrenchDateToISO(t1Raw);
            const t2Iso = parseFrenchDateToISO(t2Raw);

            const url = `${backendUrl}/api/rte?t1=${encodeURIComponent(t1Iso)}&t2=${encodeURIComponent(t2Iso)}&strict_filter=true`;
            
            const res = await fetch(url, {
                method: 'GET',
                mode: 'cors',
                headers: {
                    'Accept': 'application/json'
                }
            });

            if (!res.ok) {
                throw new Error(`HTTP ${res.status}`);
            }

            const data = await res.json();
            return data.summary ? (data.summary.t1_day_max_mw || 0) : 0;
        }

        let chartInstance = null;

        async function generateChart() {
            const year = document.getElementById('yearSelect').value;
            const dates = year === '2025' ? dates2025 : dates2026;

            const progressContainer = document.getElementById('progressContainer');
            const progressBar = document.getElementById('progressBar');
            const progressText = document.getElementById('progressText');

            progressContainer.style.display = 'block';
            progressBar.style.width = '0%';
            progressText.innerText = '0%';

            const dataPoints = [];
            let cumulativeTotal = 0;

            for (let i = 0; i < dates.length; i++) {
                const dateStr = dates[i];
                try {
                    const dailyMaxMw = await fetchDataForDate(dateStr);
                    cumulativeTotal += dailyMaxMw;
                    dataPoints.push({ x: dateStr, y: cumulativeTotal });
                } catch (err) {
                    console.error(`Error fetching date ${dateStr}:`, err);
                    dataPoints.push({ x: dateStr, y: cumulativeTotal });
                }

                const percent = Math.round(((i + 1) / dates.length) * 100);
                progressBar.style.width = `${percent}%`;
                progressText.innerText = `${percent}%`;
            }

            setTimeout(() => {
                progressContainer.style.display = 'none';
            }, 1000);

            const ctx = document.getElementById('cumulativeChart').getContext('2d');

            if (chartInstance) {
                chartInstance.destroy();
            }

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: dates.map(d => d.substring(0, 5)),
                    datasets: [{
                        label: `Cumulative Environmental Unavailability Max (MW) - ${year}`,
                        data: dataPoints.map(p => p.y),
                        borderColor: '#0056b3',
                        backgroundColor: 'rgba(0, 86, 179, 0.1)',
                        borderWidth: 2,
                        fill: true,
                        tension: 0.2,
                        pointRadius: 0,
                        pointHoverRadius: 5
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: {
                            title: { display: true, text: 'Date (DD/MM)' },
                            ticks: { maxTicksLimit: 20 }
                        },
                        y: {
                            title: { display: true, text: 'Cumulative Max MW' },
                            beginAtZero: true
                        }
                    },
                    plugins: {
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return `Cumulative: ${context.parsed.y} MW`;
                                }
                            }
                        }
                    }
                }
            });
        }
    </script>
