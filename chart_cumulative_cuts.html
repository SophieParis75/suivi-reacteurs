<script>
        const backendUrl = "https://suivi-reacteurs.vercel.app";

        const generateDailyDates = (year) => {
            const dates = [];
            const isLeap = (year % 4 === 0 && year % 100 !== 0) || (year % 400 === 0);
            const daysInMonths = [31, isLeap ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];

            for (let month = 0; month < 12; month++) {
                const days = daysInMonths[month];
                for (let day = 1; day <= days; day++) {
                    const dStr = String(day).padStart(2, '0');
                    const mStr = String(month + 1).padStart(2, '0');
                    dates.push(`${year}-${mStr}-${dStr}`);
                }
            }
            return dates;
        };

        let chartInstance = null;

        async function generateChart() {
            const year = document.getElementById('yearSelect').value;
            const progressContainer = document.getElementById('progressContainer');
            const progressBar = document.getElementById('progressBar');
            const progressText = document.getElementById('progressText');

            progressContainer.style.display = 'block';
            progressBar.style.width = '20%';
            progressText.innerText = 'Interrogation de l\'API Vercel...';

            const t1Iso = `${year}-01-01T00:00:00+01:00`;
            const t2Iso = `${year}-12-31T23:59:59+01:00`;

            const url = `${backendUrl}/api/rte?t1=${encodeURIComponent(t1Iso)}&t2=${encodeURIComponent(t2Iso)}&strict_filter=true`;

            try {
                const res = await fetch(url, {
                    method: 'GET',
                    mode: 'cors',
                    headers: { 'Accept': 'application/json' }
                });

                if (!res.ok) {
                    throw new Error(`Erreur serveur HTTP ${res.status}`);
                }

                progressBar.style.width = '70%';
                progressText.innerText = 'Calcul du cumul quotidien...';

                const data = await res.json();
                const allDates = generateDailyDates(year);
                
                // Récupération souple des événements selon le format renvoyé par Vercel
                const events = data.list_max_day_t1 || data.list_t1 || data.list_max_day_t2 || data.list_t2 || [];

                let cumulativeTotal = 0;
                const dataPoints = [];

                allDates.forEach(dateStr => {
                    const dailySum = events.reduce((acc, item) => {
                        if (!item.from || !item.to) return acc;
                        const itemStart = item.from.split('T')[0];
                        const itemEnd = item.to.split('T')[0];
                        if (dateStr >= itemStart && dateStr <= itemEnd) {
                            return acc + (item.unavailability_mw || item.unavailable || 0);
                        }
                        return acc;
                    }, 0);

                    cumulativeTotal += dailySum;
                    dataPoints.push({ x: dateStr, y: cumulativeTotal });
                });

                progressBar.style.width = '100%';
                progressText.innerText = 'Terminé !';

                setTimeout(() => {
                    progressContainer.style.display = 'none';
                }, 500);

                const ctx = document.getElementById('cumulativeChart').getContext('2d');

                if (chartInstance) {
                    chartInstance.destroy();
                }

                chartInstance = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: allDates.map(d => {
                            const [y, m, day] = d.split('-');
                            return `${day}/${m}`;
                        }),
                        datasets: [{
                            label: `Cumulative Environmental Unavailability (MW) - ${year}`,
                            data: dataPoints.map(p => p.y),
                            borderColor: '#0056b3',
                            backgroundColor: 'rgba(0, 86, 179, 0.1)',
                            borderWidth: 2,
                            fill: true,
                            tension: 0.2,
                            pointRadius: 0,
                            pointHoverRadius: 5
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            x: {
                                title: { display: true, text: 'Date (DD/MM)' },
                                ticks: { maxTicksLimit: 20 }
                            },
                            y: {
                                title: { display: true, text: 'Cumulative MW' },
                                beginAtZero: true
                            }
                        },
                        plugins: {
                            tooltip: {
                                callbacks: {
                                    label: function(context) {
                                        return `Cumulative: ${context.parsed.y} MW`;
                                    }
                                }
                            }
                        }
                    }
                });

            } catch (err) {
                console.error("Erreur lors de la génération :", err);
                progressContainer.style.display = 'none';
                alert("Erreur lors du chargement des données : " + err.message);
            }
        }
    </script>
