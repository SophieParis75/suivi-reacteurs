<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cumulative Nuclear Environmental Unavailabilities</title>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 20px; background: #0f172a; color: #f8fafc; }
        h1, h2 { color: #38bdf8; }
        .card { background: #1e293b; padding: 20px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #334155; }
        .controls { display: flex; gap: 15px; align-items: center; margin-bottom: 15px; }
        button { padding: 10px 24px; background: #0284c7; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 15px; }
        button:hover { background: #0369a1; }
        button:disabled { background: #475569; cursor: not-allowed; }
        .progress-bar-bg { background: #0f172a; border-radius: 4px; height: 10px; overflow: hidden; margin-top: 10px; border: 1px solid #334155; }
        .progress-bar-fill { background: #38bdf8; height: 100%; width: 0%; transition: width 0.2s; }
        .status-text { font-size: 14px; color: #94a3b8; margin-top: 5px; }
        .rules-info { color: #94a3b8; font-size: 14px; margin-bottom: 15px; line-height: 1.5; background: #0f172a; padding: 10px 15px; border-radius: 6px; border: 1px solid #334155; }
        .chart-container { position: relative; height: 450px; width: 100%; }
    </style>
</head>
<body>

    <h1>Cumulative Nuclear Environmental Unavailabilities</h1>

    <div class="card">
        <div class="rules-info">
            • Only cuts &gt; 30 minutes are taken into account.<br>
            • For reactors with multiple outages on the same day, only the highest outage &gt; 30 minutes is considered.
        </div>
        <div class="controls">
            <button id="btn_generate" onclick="generateChart()">Generate Chart</button>
        </div>
        <div id="progress_container" style="display: none;">
            <div class="status-text" id="status_text">Preparing analysis...</div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progress_fill"></div>
            </div>
        </div>
    </div>

    <div class="card" id="chart_card" style="display: none;">
        <div class="chart-container">
            <canvas id="cutsChart"></canvas>
        </div>
    </div>

    <script>
        let myChart = null;

        function getDatesRange() {
            const now = new Date();
            const currentYear = now.getFullYear();
            
            // Start: May 1st of current year at 12:00
            const startDate = new Date(currentYear, 4, 1); // Month 4 is May
            
            // End: Yesterday at 12:00
            const endDate = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 1);
            
            const dates = [];
            let cur = new Date(startDate);

            while (cur <= endDate) {
                const day = String(cur.getDate()).padStart(2, '0');
                const month = String(cur.getMonth() + 1).padStart(2, '0');
                const year = cur.getFullYear();
                
                // Format dd/mm/yyyy 12:00
                dates.push({
                    display: `${day}/${month}/${year}`,
                    iso: `${year}-${month}-${day}T12:00:00`
                });
                
                cur.setDate(cur.getDate() + 1);
            }

            return dates;
        }

        async function generateChart() {
            const btn = document.getElementById('btn_generate');
            const progressContainer = document.getElementById('progress_container');
            const progressFill = document.getElementById('progress_fill');
            const statusText = document.getElementById('status_text');
            const chartCard = document.getElementById('chart_card');

            btn.disabled = true;
            progressContainer.style.display = 'block';
            chartCard.style.display = 'none';

            const dates = getDatesRange();
            const labels = [];
            const dataPoints = [];

            if (dates.length === 0) {
                alert("Current date is before May 1st. No analysis range available yet.");
                btn.disabled = false;
                return;
            }

            for (let i = 0; i < dates.length; i++) {
                const dateObj = dates[i];
                const pct = Math.round(((i + 1) / dates.length) * 100);
                
                progressFill.style.width = `${pct}%`;
                statusText.innerText = `Fetching data for ${dateObj.display} (${i + 1}/${dates.length})...`;

                try {
                    // Call api/rte setting T1 = T2 = date at 12:00
                    const res = await fetch(`/api/rte?t1=${encodeURIComponent(dateObj.iso)}&t2=${encodeURIComponent(dateObj.iso)}`);
                    const data = await res.json();

                    labels.push(dateObj.display);

                    if (data.status === "success") {
                        // Takes the daily cumulative maximum in MW (> 30 min and highest per reactor)
                        dataPoints.push(data.summary.t1_day_max_mw || 0);
                    } else {
                        dataPoints.push(0);
                    }
                } catch (err) {
                    console.error("Error fetching date " + dateObj.display, err);
                    labels.push(dateObj.display);
                    dataPoints.push(0);
                }
            }

            statusText.innerText = "Rendering chart...";
            renderChart(labels, dataPoints);
            
            chartCard.style.display = 'block';
            btn.disabled = false;
            statusText.innerText = "Analysis complete!";
        }

        function renderChart(labels, dataPoints) {
            const ctx = document.getElementById('cutsChart').getContext('2d');

            if (myChart) {
                myChart.destroy();
            }

            myChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Daily Max Environmental Unavailability (MW)',
                        data: dataPoints,
                        borderColor: '#f43f5e',
                        backgroundColor: 'rgba(244, 63, 94, 0.1)',
                        borderWidth: 3,
                        fill: true,
                        tension: 0.2,
                        pointRadius: 3,
                        pointHoverRadius: 6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            labels: { color: '#f8fafc', font: { size: 14 } }
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return ` Daily Max: ${context.parsed.y} MW`;
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            grid: { color: '#334155' },
                            ticks: { color: '#94a3b8', maxRotation: 45, minRotation: 45 }
                        },
                        y: {
                            beginAtZero: true,
                            grid: { color: '#334155' },
                            ticks: { 
                                color: '#94a3b8',
                                callback: function(value) { return value + ' MW'; }
                            }
                        }
                    }
                }
            });
        }
    </script>
</body>
</html>
