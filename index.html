<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Test Connexion RTE</title>
</head>
<body style="font-family: monospace; padding: 20px; background: #121212; color: #00ff66;">
    <h1>Test Connexion API RTE</h1>
    <button onclick="testRTE()" style="padding: 10px 20px; font-size: 16px; cursor: pointer;">Lancer le test API</button>
    
    <h2>Résultat brut de l'API :</h2>
    <pre id="output" style="background: #000; padding: 15px; border-radius: 5px; white-space: pre-wrap; word-break: break-all;">Cliquer sur le bouton pour tester...</pre>

    <script>
        async function testRTE() {
            const out = document.getElementById('output');
            out.textContent = "Appel à /api/rte en cours...";
            try {
                const res = await fetch('/api/rte');
                const data = await res.json();
                out.textContent = JSON.stringify(data, null, 2);
            } catch (err) {
                out.textContent = "Erreur de requête client : " + err.message;
            }
        }
    </script>
</body>
</html>
