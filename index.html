<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuclear Environmental Unavailability Tracking</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    .control-panel { margin-bottom: 20px; }
    label { margin-right: 10px; }
    input[type="datetime-local"] { margin-right: 15px; padding: 5px; }
    button { padding: 5px 15px; cursor: pointer; }
    .metric-card { background: #f4f4f4; padding: 15px; border-radius: 5px; margin-top: 10px; width: 300px; }
  </style>
</head>
<body>

  <h1>Nuclear Environmental Unavailability Tracking</h1>

  <div class="control-panel">
    <label for="startDate">Start Date & Time:</label>
    <input type="datetime-local" id="startDate">

    <label for="endDate">End Date & Time:</label>
    <input type="datetime-local" id="endDate">

    <button onclick="fetchUnavailabilities()">Filter</button>
  </div>

  <div class="metric-card">
    <p><strong>Unique messages count:</strong> <span id="msgCount">0</span></p>
    <p><strong>Cumulative unavailable power:</strong> <span id="mwSum">0</span> MW</p>
  </div>

  <script>
    // Set default dates with hours and minutes (August 4, 00:00 to August 5, 23:59)
    document.getElementById('startDate').value = '2026-08-04T00:00';
    document.getElementById('endDate').value = '2026-08-05T23:59';

    async function fetchUnavailabilities() {
      const startDateVal = document.getElementById('startDate').value;
      const endDateVal = document.getElementById('endDate').value;

      if (!startDateVal || !endDateVal) {
        alert("Please select both start and end date/time.");
        return;
      }

      // Convert local date-time strings to UTC ISO 8601 strings for RTE API
      const isoStart = new Date(startDateVal).toISOString();
      const isoEnd = new Date(endDateVal).toISOString();

      document.getElementById('msgCount').textContent = 'Loading...';
      document.getElementById('mwSum').textContent = 'Loading...';

      try {
        const response = await fetch(`/api/rte?start_date=${encodeURIComponent(isoStart)}&end_date=${encodeURIComponent(isoEnd)}`);
        const data = await response.json();

        console.log("RTE API Payload:", data);

        const events = data.generation_unavailabilities || [];

        // 1. Filter: "nucl" for plant type and root "environ" for reason
        const filteredEvents = events.filter(item => {
          const productionType = String(item.production_type || '').toLowerCase();
          const reason = String(item.reason || item.reason_type || '').toLowerCase();
          return productionType.includes('nucl') && reason.includes('environ');
        });

        // 2. Deduplicate messages: retain highest version number per unique identifier
        const latestVersions = {};
        filteredEvents.forEach(item => {
          const identifier = item.identifier;
          if (!latestVersions[identifier] || Number(item.version) > Number(latestVersions[identifier].version)) {
            latestVersions[identifier] = item;
          }
        });
        const uniqueMessages = Object.values(latestVersions);

        // 3. Deduplicate by unit: retain maximum power loss per reactor on the selected window
        const maxLossPerUnit = {};
        uniqueMessages.forEach(item => {
          const unitKey = item.unit ? (item.unit.eic_code || item.unit.name) : item.identifier;
          const nominalPower = Number(item.nominal_power) || 0;
          const availableCapacity = Number(item.available_capacity) || 0;
          const currentLoss = nominalPower - availableCapacity;

          if (!maxLossPerUnit[unitKey] || currentLoss > maxLossPerUnit[unitKey].loss) {
            maxLossPerUnit[unitKey] = {
              item: item,
              loss: currentLoss
            };
          }
        });

        const maxLossEvents = Object.values(maxLossPerUnit);

        // 4. Calculate total MW loss
        const totalMWLoss = maxLossEvents.reduce((accumulator, record) => {
          return accumulator + record.loss;
        }, 0);

        // Update UI
        document.getElementById('msgCount').textContent = maxLossEvents.length;
        document.getElementById('mwSum').textContent = totalMWLoss.toLocaleString('en-US');

      } catch (error) {
        console.error("Fetch error:", error);
        document.getElementById('msgCount').textContent = 'Error';
        document.getElementById('mwSum').textContent = 'Error';
      }
    }

    // Auto-fetch data on page load
    fetchUnavailabilities();
  </script>
</body>
</html>
